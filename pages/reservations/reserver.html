<!-- BIGTITLE -->
<div class="hero-scene text-center text-white">
  <div class="hero-scene-content">
    <h1>Ma réservation</h1>
  </div>
</div>

<!-- Formulaire Ma réservation -->
<div class="container">
  <!-- Centrage et gestion responsive du formulaire -->
  <div class="row justify-content-center">
    <!-- Largeur : 100% sur mobile (col-12) | 40% sur desktop (col-lg-5) -->
    <div class="col-12 col-lg-5">
      <form>
        <div class="mb-3">
          <label for="lastnameInput" class="form-label">Nom</label>
          <input
            disabled
            type="text"
            class="form-control"
            id="lastnameInput"
            placeholder="Votre nom"
            value="John"
          />
        </div>
        <div class="mb-3">
          <label for="firstnameInput" class="form-label">Prénom</label>
          <input
            disabled
            type="text"
            class="form-control"
            id="firstnameInput"
            placeholder="Votre prénom"
            value="Doe"
          />
        </div>
        <div class="mb-3">
          <label for="AllergieInput" class="form-label">Allergies</label>
          <input
            type="text"
            class="form-control"
            id="AllergieInput"
            placeholder="Vos allergies (fruits de mer, arachides...)"
            value="Fruits de mer"
          />
        </div>
        <div class="mb-3">
          <label for="NbConvivesInput" class="form-label"
            >Nombre de convives habituel</label
          >
          <input
            type="number"
            class="form-control"
            id="NbConvivesInput"
            placeholder="Combien vous êtes habituellement ?"
            value="4"
          />
        </div>
        <div class="mb-3">
          <label for="DateInput" class="form-label">Date</label>
          <input type="date" class="form-control" id="DateInput" />
        </div>
        <!-- Choix du service (Midi / Soir) -->
        <div class="mb-3">
          <div class="form-check">
            <input
              class="form-check-input"
              type="radio"
              name="serviceChoisi"
              id="midiRadio"
            />
            <label class="form-check-label" for="midiRadio">Midi</label>
          </div>
          <div class="form-check">
            <input
              class="form-check-input"
              type="radio"
              name="serviceChoisi"
              id="soirRadio"
              checked
            />
            <label class="form-check-label" for="soirRadio">Soir</label>
          </div>
        </div>
        <!-- Horaire de réservation -->
        <div class="mb-3">
          <label for="selectHour" class="form-label">Heure</label>
          <select class="form-select" id="selectHour">
            <option>19:30</option>
            <option>19:45</option>
            <option>20:00</option>
            <option>20:15</option>
            <option>20:30</option>
            <option>20:45</option>
            <option>21:00</option>
          </select>
        </div>
        <!-- Boutons d'action : empilés sur mobile, côte à côte sur PC avec un espace (gap-2) -->
        <div
          class="text-center pt-4 d-flex flex-column flex-sm-row justify-content-center gap-2"
        >
          <button type="submit" class="btn btn-primary">Réserver</button>
          <a href="/" class="btn btn-danger" onclick="route(event)">
            Annuler
          </a>
        </div>
      </form>
    </div>
  </div>
</div>
