<!-- BIGTITLE -->
<div class="hero-scene text-center text-white">
  <div class="hero-scene-content">
    <h1>Changement de mot de passe</h1>
  </div>
</div>

<!-- Formulaire de changement de mot de passe -->
<div class="container">
  <!-- Centrage et gestion responsive du formulaire -->
  <div class="row justify-content-center">
    <!-- Largeur : 100% sur mobile (col-12) | 40% sur desktop (col-lg-5) -->
    <div class="col-12 col-lg-5">
      <form>
        <div class="mb-3">
          <label for="PasswordInput" class="form-label">Mot de passe</label>
          <input type="password" class="form-control" id="PasswordInput" />
        </div>
        <div class="mb-3">
          <label for="ValidatePasswordInput" class="form-label"
            >Validez votre mot de passe</label
          >
          <input
            type="password"
            class="form-control"
            id="ValidatePasswordInput"
          />
        </div>
        <div class="text-center pt-4">
          <button type="submit" class="btn btn-primary">
            Changer mon mot de passe
          </button>
        </div>
        <div class="text-center pt-4">
          <a href="/account">Modifier mes informations personnelles</a>
        </div>
      </form>
    </div>
  </div>
</div>
