<!-- BIGTITLE -->
<div class="hero-scene text-center text-white">
  <div class="hero-scene-content">
    <h1>Galerie</h1>
  </div>
</div>

<!-- Button ajouter une photo pour l'administrateur -->
<div class="text-center pt-4">
  <a href="#" class="btn btn-primary">Ajouter une photo</a>
</div>

<!-- La Galerie -->
<div class="container">
  <!-- Disposition responsive (Grille Bootstrap basée sur Flexbox) : 2 colonnes sur mobile, 3 sur PC -->
  <div class="row row-cols-2 row-cols-lg-3 justify-content-center">
    <div class="col p-3">
      <div class="image-card text-white">
        <img
          src="../images/chef.jpg"

        />
        <p class="titre-image">Titre</p>
      </div>
    </div>
    <div class="col p-3">
      <div class="image-card text-white">
        <img
          src="../images/resto.jpg"
          class="rounded w-100"
          alt="Une table du restaurant Quai Antique"
        />
        <p class="titre-image">Titre</p>
      </div>
    </div>
    <div class="col p-3">
      <div class="image-card text-white">
        <img
          src="../images/food.jpg"
          class="rounded w-100"
          alt="Des légumes de saison sur une table en bois "
        />
        <p class="titre-image">Titre</p>
      </div>
    </div>
    <div class="col p-3">
      <div class="image-card text-white">
        <img
          src="../images/FondHeroScene.jpg"
          class="rounded w-100"
          alt="Assortiment de plats gastronomiques sur une table en bois"
        />
        <p class="titre-image">Titre</p>
      </div>
    </div>
    <div class="col p-3">
      <div class="image-card text-white">

          alt="Un pavé de saumon aux herbes"
        />
        <p class="titre-image">Titre</p>
      </div>
    </div>
    <div class="col p-3">
      <div class="image-card text-white">
        <img
          src="../images/vins.jpg"
          class="rounded w-100"
          alt="Un verre de vin et sa bouteille de vin accompagné d'un assortiment d'apéritifs"
        />
        <p class="titre-image">Titre</p>
      </div>
    </div>
    <div class="col p-3">
      <div class="image-card text-white">
        <img
          src="../images/entree.jpg"

        />
        <p class="titre-image">Titre</p>
      </div>

    <div class="col p-3">
      <div class="image-card text-white">

        />
        <p class="titre-image">Titre</p>
      </div>
    </div>
    <div class="col p-3">
      <div class="image-card text-white">
        <img
          src="../images/dessert.png"
          class="rounded w-100"
          alt="Un muffin au chocolat garni de crème et fruits rouges et d'un filet de chocolat"
        />
        <p class="titre-image">Titre</p>
      </div>
    </div>

</div>
